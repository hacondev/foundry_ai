<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">
  <meta name="generator" content="">
  <title>Dodawaie tagu skrzyni</title>
  <link rel="canonical" href="">

  <!-- Bootstrap core CSS -->
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

  <!-- Data Table css -->
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/jquery.dataTables.css') }}">

  <!-- Custom styles for this template -->
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>

  <nav class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
    <a class="navbar-brand col-md-3 col-lg-2 mr-0 px-3" href="#"><b>&nbsp;</b> </a>
    <button class="navbar-toggler position-absolute d-md-none collapsed" type="button" data-toggle="collapse"
      data-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <!--input class="form-control form-control-dark w-100" type="text" placeholder="Search" aria-label="Search"-->

  </nav>

  <div class="container-fluid">
    <div class="row">
      <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
        <div class="sidebar-sticky pt-3">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link{% if request.path.rstrip('/') == '/rfid_tags' or request.path.startswith('/rfid_tags/') or request.path.startswith('/rfid/') or request.path.rstrip('/') == '/tag_frame' or request.path.startswith('/tag_add_frame/') or request.path.startswith('/tag_add_pattern/') %} active{% endif %}" href="/rfid_tags"{% if request.path.rstrip('/') == '/rfid_tags' or request.path.startswith('/rfid_tags/') or request.path.startswith('/rfid/') or request.path.rstrip('/') == '/tag_frame' or request.path.startswith('/tag_add_frame/') or request.path.startswith('/tag_add_pattern/') %} aria-current="page"{% endif %}>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="feather feather-wifi" aria-hidden="true"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0M12 20h.01"/></svg>
                Odczyt tagów RFID
              </a>
            </li>
          </ul>
        </div>
      </nav>

      <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-md-4">
        <div
          class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2">Dodawanie nowego tagu skrzyni</h1>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-info alert-dismissible fade show" role="alert" style="width: 60%">
          {{ msg }}
          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/tag_add_frame/{{ tag }}" method="POST">
          <div class="form-group" style="width: 50%">
            <label for="tag" class="">TAG:</label>
            <div class="">
              <input type="text" class="form-control form-control-lg" id="tag" name="tag" placeholder=""
                value='{{ tag }}' disabled required>
            </div>
          </div>

          <button type="submit" class="btn btn-success btn-lg">Zatwiedź</button>
          <a class="btn btn-primary btn-lg" role="button" href="/rfid_tags">Zrezygnuj</a>

          <!--button type="reset" class="btn btn-dark btn-lg">Wyczyść polę</button-->

        </form>

        <br><br>

      </main>

    </div>
  </div>
  <script src="{{ url_for('static', filename='js/jquery.slim.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/feather.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  <script type="text/javascript" charset="utf8" src="{{ url_for('static', filename='js/jquery.dataTables.js') }}">
  </script>
  <script>
    $(document).ready(function () {
      $(window).keydown(function (event) {
        if (event.keyCode == 13) {
          event.preventDefault();
          return false;
        }
      });
    });
  </script>
</body>

</html>
