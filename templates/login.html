<body class="text-center">

  <form class="form-signin" method="POST">
    <div class="card" style="width: 23rem;">
      <div class="card-body" >


    <!--img class="mb-4" src="{{ url_for('static', filename='img/hacon-logo.png') }}" alt="" -->
    <h1 class="h3 mb-3 font-weight-normal">

      <div class="form-group" >
        <img src="{{ url_for('static', filename='img/h1.jpg') }}" class="img-fluid rounded" >
      </div>

      <br>
      Logowanie
    </h1>
    <div class="form-group" >
      <label for="username" class="sr-only">Login</label>
      <input type="text" id="username" class="form-control" placeholder="Login" name="username" required>
    </div>

    <div class="form-group">
      <label for="password" class="sr-only">Hasło</label>
      <input type="password" id="password" class="form-control" placeholder="Hasło" name="password"  required>
    </div>
    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="remember-me"> Zapamiętaj mnie
      </label>
    </div>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-danger text-center" role="alert">
      {{ msg }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    <button class="btn btn-lg btn-primary btn-block" type="submit">Zaloguj</button> 
    <a href="/foundry_production_status_kiosk" target=_blank class="btn btn-secondary btn-lg btn-block btn-sm" role="button" aria-pressed="true">

        <path fill-rule="evenodd" d="M6.664 15.889A8 8 0 1 1 9.336.11a8 8 0 0 1-2.672 15.78zm-4.665-4.283A11.95 11.95 0 0 1 8 10c2.186 0 4.236.585 6.001 1.606a7 7 0 1 0-12.002 0"/>
      </svg>
      Status dashboard</a>

        <p class="mt-5 mb-3 text-muted"><b>MES</b> (wersja: 4.01)</p>
        
    </div>
    </div>
